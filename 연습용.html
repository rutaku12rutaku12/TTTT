<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>실습14따라치기</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='연습용.js'></script>
</head>
<body>
    
    <div id="wrap">
        <div id ="header">
            <select id = "categoryInput">
                <option value="" disabled selected > 카테고리 선택하세요. </option>
                <option value="1"> 음료</option>
                <option value="2"> 과자</option>
            </select>
            <input id="pnameInput" type="text" placeholder="제품명" />
            <input id="ppriceInput" type="number" placeholder="제품가격" />
            <input id="pimgInput" type="file" accept="image/*" />
            <button onclick="productAdd()" class="btnAdd"> 등록 </button>
        </div>
        <div id="main">
            <table>
                <thead>
                    <tr>
                        <th>이미지</th>
                        <th>카테고리명</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>등록일</th>
                        <th>비고</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="https://placehold.co/100x100" /></td>
                        <th> 음료</th>
                        <td>코카콜라</td>
                        <td>1000</td>
                        <td>2025-06-18</td>
                        <td>비고</td>
                        <td><button class="btnDelete">삭제</button><button class="btnEdit">수정</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

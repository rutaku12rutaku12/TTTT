<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    
    <div id="wrap">
        <div id="header">
            <input id="pnameInput" type="text" placeholder="제품명"/>
            <input id="ppiceInput" type="number" placeholder="제품가격"/>
            <textarea id="pcontentInput" placeholder="간단한설명"></textarea>
            <input id="pimgInput" type="file" accept="img/*"/>
            <button onclick="productAdd" class="btnAdd"> 등록 </button>

        </div>
        <div id="main">
            <table>
                <thead>
                    <tr>
                        <th>이미지</th>
                        <th>상품명</th>
                        <th>가격</th>
                        <th>설명</th>
                        <th>비고</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>콜라사진</td>
                        <td>콜라</td>
                        <td>1500</td>
                        <td>제로콜라</td>
                        <td><button class="productDelete()">삭제</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

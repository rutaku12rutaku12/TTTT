<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>

    <title>1_실습15</title>
<style>    /* CSS 문법 */
        /* 전체 레이아웃 컨테이너 */
        #wrap {
            width: 100%;
            max-width: 960px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            margin: 50px auto;
            display: flex;
            
        }
        
        /* 등록 영역 */
        #header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        /* 입력 필드 (input, select) 공통 스타일 */
        #header input, #header select {
            padding: 12px;
            font-size: 14px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }

        /* 등록 버튼 */
        .btnAdd {
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: #4c6ef5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #main{
            max-height: 800px;
            overflow-y: auto;
        }
        #snameInput{
            width: 150px;
        }

        /* 테이블 전체 */
        #main table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            font-size: 16px;
            text-align: center;
        }
        
        /* 테이블 헤더 */
        #main thead {
            background-color: #f8f9fa;
        }

        #main th {
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            color: #495057;
        }

        /* 테이블 바디 */
        #main tbody tr:hover {
            background-color: #f1f3f5;
        }

        #main td {
            padding: 5px;
            border-bottom: 1px solid #e9ecef;
        }

        /* 테이블 내 이미지 */
        #main img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e9ecef;
        }

        /* 테이블 내 버튼 공통 스타일 */
        .btnDelete, .btnEdit {
            font-size: 15px;
            padding: 7px 12px;
            margin: 0 4px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid transparent;
            cursor: pointer;
        }
        
        /* 수정 버튼 */
        .btnEdit {
            color: #4c6ef5;
            background-color: #edf2ff;
            border-color: #dbe4ff;
        }
        /* 삭제 버튼 */
        .btnDelete {
            color: #f03e3e;
            background-color: #fff5f5;
            border-color: #ffe3e3;
        }
    </style>
    

</head>
<body>

    <div id="wrap"> <!-- 전체구역 -->
        <div id="leftBar">  <!-- 왼쪽 -->
            <div id="departmentInput">  <!-- 부서 등록구역 -->
                <h3> 부서 관리 </h3>
                <input id="dnameInput" type="text" placeholder="신규 부서명 입력" /> 
                <button onclick="departmentAdd()" class="btnAdd"> 추가 </button>
            </div>
            <div id="departmentOutput"> <!-- 부서 출력구역 -->
                <table>
                    <thead>
                        <tr>
                            <th> 부서명 </th> <th> 관리 </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td> 개발팀 </td>
                            <td> 디자인팀 </td>
                            <td> 기획팀 </td>
                            <td> <button class="btnEdit"> 수정 </button> <button class="btnDelete"> 삭제 </button> </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="main">  <!-- 가운데 -->
            <div id="staffInput">  <!-- 사원 등록구역 -->
                <h3> 사원 등록 </h3>
                이름<input id="snameInput" type="name" /> 
                직급<input id="srankInput" type="text" /> <br/>
                부서<select id="sdnameInput">
                        <option value="" disabled selected > 부서를 선택하세요 </option>
                        <option value="1"> 개발팀 </option>
                        <option value="2"> 디자인팀 </option> 
                        <option value="3"> 기획팀 </option>
                    </select><br/>
                사진<input id="simgInput" type="file" accept="image/*" />
                <button onclick="staffAdd()" class="btnAdd"> 등록 </button>
            </div>
            <div id="staffOutput"> <!-- 사원 출력구역 -->
                <h3>사원 전체 목록</h3>
                <table>
                    <thead>
                        <tr>
                            <th> 사진 </th> <th> 이름 </th> <th> 부서 </th> <th> 직급 </th> <th> 관리 </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td> <img src="https://placehold.co/100x100" /> </td> 
                            <td> 김원준 </td>
                            <td> 개발팀 </td>
                            <td> 선임 개발자 </td>
                            <td> <button class="btnEdit"> 수정 </button> <button class="btnDelete"> 삭제 </button> </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="rightBar"> <!-- 오른쪽 -->
            <h3>사원 휴가 신청</h3>
            신청 사원   <select>
                            <option>휴가 신청 사원을 선택하세요</option>
                            <option></option>
                        </select>                                                   <br/>
            휴가 시작일 <input type="date" /> 휴가 종료일 <input type="date" /> <br/>
            휴가사유<input type="text" placeholder="예: 여름휴가" />            <br/>
            <button>신청</button>

            <h3>휴가 신청 전체 목록</h3>
            <div> 
                <h4>김민준<button>신청취소</button></h4>
                2025-08-04 ~ 2025-08-04     <br/>
                사유:병원진료               <br/>
            </div>
            <div> 
                <h4>이서연<button>신청취소</button></h4> 
                2025-07-21 ~ 2025-07-25     <br/>
                사유:여름 휴가              <br/>
            </div>


        </div>
    </div>



        <script src='1_실습15.js'></script>
</body>
</html>
